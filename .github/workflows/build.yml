name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Check public test fixtures
        run: python tests/check-fixtures.py
      - name: Check native UI translations and Ribbon labels
        run: python tests/check-localization.py
      - name: Build native add-in
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Architecture x64
          ./scripts/build.ps1 -Architecture x86
      - name: Test layout, appearance, window state, persistence, close choices and localization
        shell: pwsh
        run: |
          ./scripts/test-native.ps1 -Architecture x64
          ./scripts/test-native.ps1 -Architecture x86
      - name: Verify both native DLL export ABIs without registration
        shell: pwsh
        run: ./tests/native-payload-test.ps1
      - name: Build Tauri center with embedded native payload
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -SkipNative
      - name: Test shared settings and update validation
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File ./tests/desktop-service-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File ./tests/uninstall-worker-test.ps1
      - name: Build and verify installers
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - name: Verify Tauri package and embedded payload
        shell: pwsh
        run: ./tests/desktop-package-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: openOfficetab-win-x64
          path: delivery/*
      - name: Publish rolling nightly release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "nightly"
          $title = "openOfficeTab nightly (run #${{ github.run_number }})"
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $commit = "${{ github.sha }}".Substring(0, 7)
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $notes = "openOfficeTab Windows x64 nightly build.`n`n- Built at: $timestamp`n- Run: [run #${{ github.run_number }}]($runUrl)`n- Commit: ``$commit```n"
          $files = @(Get-ChildItem -Path "delivery/*" -File | ForEach-Object { $_.FullName })
          $viewOutput = & gh release view $tag --repo ${{ github.repository }} 2>&1
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag @files --repo ${{ github.repository }} --clobber
            & gh release edit $tag --repo ${{ github.repository }} --title $title --notes $notes
            $releaseId = (& gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq .id)
            & gh api -X PATCH "repos/${{ github.repository }}/releases/$releaseId" -F draft=true | Out-Null
            & gh api -X PATCH "repos/${{ github.repository }}/releases/$releaseId" -F draft=false | Out-Null
          } else {
            & gh release create $tag @files --repo ${{ github.repository }} --title $title --notes $notes --prerelease
          }

          $releases = (& gh release list --repo ${{ github.repository }} --json tagName --jq '.[].tagName')
          foreach ($r in $releases) {
            if ($r -and $r -ne $tag) {
              & gh release delete $r --repo ${{ github.repository }} --yes --cleanup-tag
            }
          }
